name: approval-at-head-reusable

# fleet-chezmoi#2386. ORG-WIDE REUSABLE: the approval-at-head gate. Hosted in this
# PUBLIC repo because a public repo cannot call a reusable workflow stored in a
# private one. Callers pin it by FULL sha:
#
#   jobs:
#     approval-at-head:
#       uses: skyphusion-labs/.github/.github/workflows/approval-at-head-reusable.yml@<sha>
#       with:
#         pr_number: ${{ github.event.pull_request.number }}
#         head_sha: ${{ github.event.pull_request.head.sha }}
#
# in a workflow named approval-at-head.yml on pull_request [opened, reopened,
# synchronize] ONLY. The required context is then exactly `approval-at-head / gate`
# (caller job id / this job name). A review re-runs that run through
# approval-at-head-retrigger-reusable.yml; it must never judge in a second suite,
# because a red run in one suite blocks the merge whatever another suite says
# (measured, fleet-chezmoi#2626).
#
# THE JUDGE IS THIS REPO AT THE PINNED SHA, NEVER THE CALLER'S TREE. The script is
# checked out from job.workflow_repository at job.workflow_sha, which name the
# repo and sha of THIS reusable as the caller pinned it. Checking out the caller
# instead would let a PR edit the script that judges it. If either context is
# empty, the job refuses (red) rather than fall back to the caller.
#
# PASS: a trusted reviewer's latest decision is APPROVED, at the head commit_id,
# submitted strictly after the remote first saw the head (earliest created_at
# across actions/runs?head_sha=<full sha>). Tolerance 0 s. See the script header.
on:
  workflow_call:
    inputs:
      pr_number:
        description: "the pull request number"
        required: true
        type: number
      head_sha:
        description: "the FULL 40-char head sha the event was raised for"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: the judge is the pinned reusable, never the caller
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          echo "judge: $WF_REPO@$WF_SHA"
          if [ -z "$WF_REPO" ] || ! printf '%s' "$WF_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty or malformed; refusing rather than judging with the caller's own tree."
            exit 2
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _approval-at-head
          persist-credentials: false

      # Exit 0 PASS, 1 FINDING, 2 COULD NOT MEASURE. Both 1 and 2 are red.
      - name: an approval exists after the remote first saw the head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          python3 _approval-at-head/.github/scripts/approval-at-head.py \
            --repo "$REPO" --pr "$PR_NUMBER" --head-sha "$HEAD_SHA"
