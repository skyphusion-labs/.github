# Jekyll config for the GitHub Pages org site at https://github.skyphusion.org
# (custom domain via the CNAME file; DNS CNAME github.skyphusion.org -> skyphusion-labs.github.io).
# index.md wraps profile/README.md so the org profile and the web page stay one document.

title: Skyphusion Labs Free Open Source Software
description: >-
  Skyphusion Labs builds free, open source software that is not for sale: Vivijure
  self-hosted AI film studio (v1.0), Postern agent mailbox (v1.4), Prism multimodal
  AI with public BYOK, Hollow Grid, security-audit, and more. Founded by Conrad
  Rockenhaus; one architect and five collaborators. Blog skyphusion.net, lab
  skyphusion.org, code github.com/skyphusion-labs.
url: "https://github.skyphusion.org"
baseurl: ""
lang: en

author:
  name: Conrad Rockenhaus
  email: conrad@skyphusion.org

twitter:
  username: skyphusion
  card: summary_large_image

social:
  name: Skyphusion Labs
  links:
    - https://github.com/skyphusion-labs
    - https://github.com/skyphusion
    - https://skyphusion.org
    - https://skyphusion.net
    - https://github.skyphusion.net
    - https://x.com/skyphusion
    - https://vivijure.com
    - https://demo.vivijure.com

defaults:
  - scope:
      path: ""
    values:
      image: https://skyphusion.org/og-image.png

theme: jekyll-theme-minimal

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Keep community-health and internal docs out of the rendered site.
exclude:
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - SECURITY.md
  - docs/
  - profile/
