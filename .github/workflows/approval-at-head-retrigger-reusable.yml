name: approval-at-head-retrigger-reusable

# fleet-chezmoi#2386. ORG-WIDE REUSABLE, the review half of approval-at-head.
# Callers pin it by FULL sha (the SAME sha as approval-at-head-reusable.yml), from
# a workflow on pull_request_review [submitted, dismissed]:
#
#   jobs:
#     approval-at-head-retrigger:
#       uses: skyphusion-labs/.github/.github/workflows/approval-at-head-retrigger-reusable.yml@<sha>
#       with:
#         head_sha: ${{ github.event.pull_request.head.sha }}
#
# It does NOT judge. It waits for the pull_request run of the caller's
# approval-at-head.yml for the head to finish, then RE-RUNS it. A re-run is a new
# attempt in the SAME check suite and replaces that suite's check; a second check
# of the same name in another suite cannot clear a red one (measured,
# fleet-chezmoi#2626). The composite action is pinned at a LITERAL sha, as in
# approval-at-head-reusable.yml.
#
# This job's check is NOT a required context. If it fails the gate stays red, the
# safe side. Known red-side case: a fork PR's review event gets a read-only token,
# the re-run is refused, and a maintainer re-runs the gate by hand.
on:
  workflow_call:
    inputs:
      head_sha:
        description: "the FULL 40-char head sha the review was raised for"
        required: true
        type: string
      gate_workflow:
        description: "the caller repo's gate workflow file name"
        required: false
        type: string
        default: approval-at-head.yml

permissions:
  contents: read
  actions: write

jobs:
  retrigger:
    name: retrigger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      # Exit 0 re-run requested, 2 could not (no run, never finished, refused).
      - name: re-run the pull_request suite run for this head
        uses: skyphusion-labs/.github/.github/actions/approval-at-head@e4223a9c244ee772957f792fe513faf8d623e4d2 # .github#60
        with:
          mode: retrigger
          head-sha: ${{ inputs.head_sha }}
          gate-workflow: ${{ inputs.gate_workflow }}
